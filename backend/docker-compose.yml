# Everything the backend needs, on one machine. For production, put a TLS
# proxy (Caddy, nginx) in front of `api`, and keep the volumes backed up
# (docs/backend/OPERATIONS.md).
#
#   cp .env.example .env    # fill in ENCRYPTION_KEY and the passwords
#   docker compose up -d --build

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: teamchat
      POSTGRES_USER: teamchat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./backups:/backups
      - ./scripts:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamchat -d teamchat"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
    volumes:
      - minio:/data
    ports:
      - "9000:9000" # clients upload and download here with signed URLs
    restart: unless-stopped

  minio-setup:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    entrypoint: >
      sh -c "until mc alias set local http://minio:9000 $$S3_ACCESS_KEY_ID $$S3_SECRET_ACCESS_KEY; do sleep 1; done &&
             mc mb --ignore-existing local/teamchat"
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}

  api:
    build: .
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    env_file: .env
    environment:
      DATABASE_URL: postgres://teamchat:${POSTGRES_PASSWORD}@postgres:5432/teamchat
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_BUCKET: teamchat
      S3_FORCE_PATH_STYLE: "true"
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres:
  redis:
  minio:
